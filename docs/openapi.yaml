    get:
      operationId: getRenderMedia
      summary: Presigned media URL (play, download, thumbnail)
      description: F3. Presigned R2 GET URL valid 15 min, issued after the ownership check. `redirect=true` answers 302. 409 INVALID_STATE when the render is not ready.
      tags: [Video]
      security:
        - sessionCookie: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [video, download, thumbnail]
        - name: redirect
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUrl'
              example: { kind: download, url: 'https://bytereel-prod.r2.example-account.r2.cloudflarestorage.com/users/67330c1a9f1e4b2a7c0d1e01/projects/67330d5e9f1e4b2a7c0d2a10/renders/67330f109f1e4b2a7c0d6f01/output.mp4?response-content-disposition=attachment%3B%20filename%3D%22How%20UPI%20payments%20work.mp4%22&X-Amz-Expires=900&X-Amz-Signature=8a2b', expiresAt: '2026-11-12T06:01:10.000Z' }
        '302':
          description: Redirect to the presigned URL (redirect=true).
