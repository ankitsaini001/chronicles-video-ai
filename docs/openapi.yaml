              units:
                $ref: '#/components/schemas/UsageUnits'
              estCostInr:
                type: number
        ceilings:
          type: array
          items:
            type: object
            required: [name, used, limit, percent, period]
            properties:
              name:
                type: string
                enum: [elevenlabs_characters_month, gemini_requests_day, sandbox_render_minutes_day, spend_inr_day]
              used:
                type: number
              limit:
                type: number
              percent:
                type: number
              period:
                type: string
                enum: [day, month]
        metrics:
          type: object
          required: [videosGenerated, renderSuccessRate, medianIdeaToVideoSeconds, medianRenderSeconds, avgRevisionsPerProject, publishSuccessRate]
          properties:
            videosGenerated:
              type: integer
            renderSuccessRate:
              type: [number, 'null']
            medianIdeaToVideoSeconds:
              type: [number, 'null']
            medianRenderSeconds:
              type: [number, 'null']
            avgRevisionsPerProject:
              type: [number, 'null']
            publishSuccessRate:
              type: [number, 'null']
    SettingsBody:
      type: object
      description: Top-level additionalProperties is not closed because Settings/UpdateSettingsRequest extend it with allOf; the server rejects unknown keys.
      required: [maintenance, limits, ceilings, models, voices]
      properties:
        maintenance:
          type: object
          additionalProperties: false
          required: [active, message]
          properties:
            active:
              type: boolean
            message:
              type: [string, 'null']
              maxLength: 300
        limits:
          type: object
          additionalProperties: false
          required: [videosPerUserPerDay, projectsPerUserPerDay, planRequestsPerProject, voiceCharactersPerUserPerMonth]
          properties:
            videosPerUserPerDay:
              type: integer
              minimum: 0
              maximum: 50
            projectsPerUserPerDay:
              type: integer
              minimum: 0
              maximum: 100
            planRequestsPerProject:
              type: integer
              minimum: 1
              maximum: 200
            voiceCharactersPerUserPerMonth:
              type: integer
              minimum: 0
              maximum: 1000000
        ceilings:
          type: object
          additionalProperties: false
          required: [elevenLabsCharactersPerMonth, geminiRequestsPerDay, sandboxRenderMinutesPerDay, spendInrPerDay]
          properties:
            elevenLabsCharactersPerMonth:
              type: integer
              minimum: 0
            geminiRequestsPerDay:
              type: integer
              minimum: 0
            sandboxRenderMinutesPerDay:
              type: number
              minimum: 0
            spendInrPerDay:
              type: number
              minimum: 0
        models:
          type: object
          additionalProperties: false
          required: [planner, speech]
          properties:
            planner:
              type: string
              pattern: '^gemini-[a-z0-9.-]+$'
            speech:
              type: string
              pattern: '^eleven_[a-z0-9_]+$'
        voices:
          type: object
          additionalProperties: false
          required: [enabledPresets]
          properties:
            enabledPresets:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/VoicePreset'
    Settings:
      allOf:
        - $ref: '#/components/schemas/SettingsBody'
        - type: object
          required: [version, updatedAt, updatedBy]
          properties:
            version:
              type: integer
              minimum: 1
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
            updatedBy:
              $ref: '#/components/schemas/ObjectId'
    DeletionStatus:
      type: object
      required: [confirmationCode, status, requestedAt, completedAt]
      properties:
        confirmationCode:
          type: string
          pattern: '^DEL-[A-Z0-9]{8}$'
        status:
          type: string
          enum: [pending, completed, failed]
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/NullableTimestamp'

    # ---------- Better Auth ----------
    BetterAuthUser:
      type: object
      required: [id, email]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        image:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        timezone:
          type: string
        defaultLanguage:
          $ref: '#/components/schemas/Language'
        defaultVoiceGender:
          $ref: '#/components/schemas/VoiceGender'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    BetterAuthSession:
      type: object
      required: [id, userId, expiresAt, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    AuthTokenResponse:
      type: object
      required: [token, user]
      properties:
        redirect:
          type: boolean
        token:
          type: string
        user:
          $ref: '#/components/schemas/BetterAuthUser'

    # ---------- request bodies ----------
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          description: Ignored; sessions are always 30 days.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        revokeOtherSessions:
          type: boolean
          description: Forced to true server side.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
          description: IANA timezone name.
        defaultLanguage:
          $ref: '#/components/schemas/Language'
        defaultVoiceGender:
          $ref: '#/components/schemas/VoiceGender'
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password, confirm]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
        confirm:
          type: string
          const: DELETE
    MarkReadRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [ids]
        - required: [all]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ObjectId'
        all:
          type: boolean
          const: true
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [inputType, text, language, voiceGender]
      description: 'text: topic 3–300, notes 20–5000, brainstorm 3–300 chars; brainstormChoice required iff inputType = brainstorm.'
      properties:
        inputType:
          $ref: '#/components/schemas/InputType'
        text:
          type: string
          minLength: 3
          maxLength: 5000
        language:
          $ref: '#/components/schemas/Language'
        voiceGender:
          $ref: '#/components/schemas/VoiceGender'
        brainstormChoice:
          $ref: '#/components/schemas/BrainstormChoice'
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [title, expectedStateVersion]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        expectedStateVersion:
          type: integer
          minimum: 1
    BrainstormRequest:
      type: object
      additionalProperties: false
      required: [subject, language]
      properties:
        subject:
          type: string
          minLength: 2
          maxLength: 100
        language:
          $ref: '#/components/schemas/Language'
    NarrationEditRequest:
      type: object
      additionalProperties: false
      required: [basePlanVersionId, sceneId, narrationId, text, expectedStateVersion]
      properties:
        basePlanVersionId:
          $ref: '#/components/schemas/ObjectId'
        sceneId:
          $ref: '#/components/schemas/SafeId'
        narrationId:
          $ref: '#/components/schemas/SafeId'
        text:
          type: string
          minLength: 1
          maxLength: 300
        speech:
          type: [string, 'null']
          minLength: 1
          maxLength: 300
        display:
          type: [string, 'null']
          minLength: 1
          maxLength: 300
        expectedStateVersion:
          type: integer
          minimum: 1
    VoiceChangeRequest:
      type: object
      additionalProperties: false
      required: [basePlanVersionId, voiceGender, expectedStateVersion]
      properties:
        basePlanVersionId:
          $ref: '#/components/schemas/ObjectId'
        voiceGender:
          $ref: '#/components/schemas/VoiceGender'
        expectedStateVersion:
          type: integer
          minimum: 1
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [stage, scope, message, basePlanVersionId, expectedStateVersion]
      description: sceneId is required iff scope = scene.
      properties:
        stage:
          $ref: '#/components/schemas/RevisionStage'
        scope:
          $ref: '#/components/schemas/RevisionScope'
        sceneId:
          $ref: '#/components/schemas/SafeId'
        message:
          type: string
          minLength: 3
          maxLength: 500
        basePlanVersionId:
          $ref: '#/components/schemas/ObjectId'
        expectedStateVersion:
          type: integer
          minimum: 1
    ExpectedStateVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedStateVersion]
      properties:
        expectedStateVersion:
          type: integer
          minimum: 1
    ApproveStoryboardRequest:
      type: object
      additionalProperties: false
      required: [planVersionId, planHash, expectedStateVersion]
      properties:
        planVersionId:
          $ref: '#/components/schemas/ObjectId'
        planHash:
          $ref: '#/components/schemas/Sha256'
        expectedStateVersion:
          type: integer
          minimum: 1
    EmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    CaptionOverridesRequest:
      type: object
      additionalProperties: false
      required: [edits, expectedStateVersion]
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [sceneId, phraseIndex, text]
            properties:
              sceneId:
                $ref: '#/components/schemas/SafeId'
              phraseIndex:
                type: integer
                minimum: 0
              text:
                type: string
                minLength: 1
                maxLength: 200
        expectedStateVersion:
          type: integer
          minimum: 1
    CaptionSuggestionRequest:
      type: object
      additionalProperties: false
      required: [renderId]
      properties:
        renderId:
          type: string
          pattern: '^([0-9a-f]{24}|current)$'
    CreatePostRequest:
      type: object
      additionalProperties: false
      required: [mode, renderId, mp4Sha256, connectionId, caption, expectedStateVersion]
      description: scheduledAt is required iff mode = scheduled (≥ now + 10 min, ≤ now + 75 days).
      properties:
        mode:
          $ref: '#/components/schemas/PostMode'
        renderId:
          $ref: '#/components/schemas/ObjectId'
        mp4Sha256:
          $ref: '#/components/schemas/Sha256'
        connectionId:
          $ref: '#/components/schemas/ObjectId'
        caption:
          type: string
          minLength: 1
          maxLength: 2200
        scheduledAt:
          type: string
          format: date-time
        expectedStateVersion:
          type: integer
          minimum: 1
    AddAllowlistRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        note:
          type: string
          maxLength: 200
    UpdateUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      description: reason is required when status = suspended.
      properties:
        status:
          type: string
          enum: [active, suspended]
        reason:
          type: string
          maxLength: 200
    UpdateSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/SettingsBody'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 1
    SignedRequestForm:
      type: object
      additionalProperties: false
      required: [signed_request]
      properties:
        signed_request:
          type: string
          description: '<base64url HMAC-SHA256 signature>.<base64url JSON payload { user_id, algorithm, issued_at }>'

    # ---------- composite responses ----------
    ProjectAndJob:
      type: object
      required: [project, job]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        job:
          $ref: '#/components/schemas/Job'
    RevisionAndJob:
      type: object
      required: [revision, job]
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        job:
          $ref: '#/components/schemas/Job'
    ApprovalResult:
      type: object
      required: [approval, job, project]
      properties:
        approval:
          $ref: '#/components/schemas/StoryboardApproval'
        job:
          $ref: '#/components/schemas/Job'
        project:
          $ref: '#/components/schemas/Project'
    CaptionOverridesResult:
      type: object
      required: [captionOverrideSetId, job, project]
      properties:
        captionOverrideSetId:
          $ref: '#/components/schemas/ObjectId'
        job:
          $ref: '#/components/schemas/Job'
        project:
          $ref: '#/components/schemas/Project'
    PostResult:
      type: object
      required: [post, job, project]
      properties:
        post:
          $ref: '#/components/schemas/Post'
        job:
          $ref: '#/components/schemas/Job'
        project:
          $ref: '#/components/schemas/Project'
    PostRetryResult:
      type: object
      required: [post, job]
      properties:
        post:
          $ref: '#/components/schemas/Post'
        job:
          $ref: '#/components/schemas/Job'
    ConnectionResponse:
      type: object
      required: [connection]
      properties:
        connection:
          anyOf:
            - $ref: '#/components/schemas/InstagramConnection'
            - type: 'null'
    CaptionSuggestion:
      type: object
      required: [caption, hashtags, language]
      properties:
        caption:
          type: string
          maxLength: 2000
        hashtags:
          type: array
          maxItems: 30
          items:
            type: string
            pattern: '^#[^\s#]{1,100}$'
        language:
          $ref: '#/components/schemas/Language'
    BrainstormResponse:
      type: object
      required: [subject, language, ideas]
      properties:
        subject:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        ideas:
          type: array
          minItems: 5
          maxItems: 8
          items:
            $ref: '#/components/schemas/BrainstormIdea'
    DeletionAccepted:
      type: object
      required: [deletionRequestId, status, requestedAt]
      properties:
        deletionRequestId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          const: pending
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
    MetaDataDeletionResponse:
      type: object
      required: [url, confirmation_code]
      description: Meta's required snake_case shape.
      properties:
        url:
          type: string
          format: uri
        confirmation_code:
          type: string
          pattern: '^DEL-[A-Z0-9]{8}$'
    ResetLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          $ref: '#/components/schemas/Timestamp'

    # ---------- pages ----------
    NextCursor:
      type: [string, 'null']
      description: Opaque cursor for the next page; null when there are no more items.
    ProjectSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    PlanVersionSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    RevisionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    RenderSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RenderSummary'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    PostPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    AllowlistPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllowlistEntry'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    AdminUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    AdminJobPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminJob'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    VoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Voice'

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    PlanVersionIdOrCurrent:
      name: planVersionId
      in: path
      required: true
      description: A plan version id or the literal `current`.
      schema:
        type: string
        pattern: '^([0-9a-f]{24}|current)$'
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    RenderIdOrCurrent:
      name: renderId
      in: path
      required: true
      description: A render id or the literal `current`.
      schema:
        type: string
        pattern: '^([0-9a-f]{24}|current)$'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    PostId:
      name: postId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    ConfirmationCode:
      name: confirmationCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^DEL-[A-Z0-9]{8}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    AdminLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous `nextCursor`.
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (e.g. UUID v4) per click. Stored 24 h per user; a replay returns the original status and body with `Idempotent-Replayed true`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_:-]{8,128}$'
      example: 9b2f4c1e-7d3a-4e8b-a1c5-2f6d8e0b4a71
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'The project stateVersion in quotes, e.g. "9" (alternative to expectedStateVersion for body-less calls).'
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"9"'

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    IdempotentReplayed:
      description: Present with value `true` when the response is a replay of an earlier request with the same Idempotency-Key.
      schema:
        type: string
        enum: ['true']
    ETag:
      description: 'The project stateVersion in quotes, e.g. "6".'
      schema:
        type: string
    Location:
      description: Redirect target.
      schema:
        type: string
    SetCookie:
      description: Session cookie (httpOnly, Secure, SameSite=Lax, Path=/).
      schema:
        type: string

  responses:
    Unauthenticated:
      description: No valid session (UNAUTHENTICATED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNAUTHENTICATED, message: Please log in again., requestId: req_01JCXK70B4M2 }
    Forbidden:
      description: Origin check failed or not allowed (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: FORBIDDEN, message: Please reload the page and try again., details: { reason: origin_mismatch }, requestId: req_01JCXK6S8Q2V }
    AdminOnly:
      description: Caller is not an admin, or Origin check failed (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: FORBIDDEN, message: "You don't have access to this page.", details: { reason: admin_only }, requestId: req_01JCXM5G3H4J }
    NotFound:
      description: Not found or owned by another user (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: NOT_FOUND, message: "We couldn't find this project.", requestId: req_01JCXM1G6H7J }
    InvalidInput:
      description: Validation failed (INVALID_INPUT).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INVALID_INPUT, message: Please check the highlighted fields., details: { issues: [ { path: text, message: must be at most 300 characters } ] }, requestId: req_01JCXKA2YH5D }
    PayloadTooLarge:
      description: Body larger than 64 KB (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PAYLOAD_TOO_LARGE, message: This request is too large., requestId: req_01JCXKZZ0001 }
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: RATE_LIMITED, message: "You're going a bit fast. Please wait a minute.", details: { retryAfterSeconds: 42 }, requestId: req_01JCXKC4H6RN }
    TooManyRequests:
      description: Rate limit (RATE_LIMITED, with Retry-After) or a product quota (QUOTA_EXCEEDED, with details.resetsAt).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            quotaVideos:
              $ref: '#/components/examples/ErrQuotaVideos'
            rateLimited:
              $ref: '#/components/examples/ErrRateLimited'
    Conflict:
