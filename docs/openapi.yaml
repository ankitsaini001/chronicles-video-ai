  # =============================== Jobs ===============================
  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      summary: Job status
      description: E1. Poll every 2 s while pollAfterMs is not null. Rate limit 120/min.
      tags: [Jobs]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                running:
                  $ref: '#/components/examples/JobGenerateRunning'
                needsInput:
                  $ref: '#/components/examples/JobNeedsInput'
                failed:
                  $ref: '#/components/examples/JobPlanFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: retryJob
      summary: Retry / resume a failed job
      description: |
        E2. Same job id, attempt + 1, finished stages reused. Allowed for failed jobs with error.retryable and
        cancelled plan/caption jobs (not publish jobs: use the post retry). **Idempotency-Key required.**
        409: INVALID_STATE, JOB_ALREADY_RUNNING, APPROVAL_REQUIRED. 503 SPEND_CEILING. Rate limit 30/hour.
      tags: [Jobs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '202':
          description: The job, queued again.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                requeued:
                  $ref: '#/components/examples/JobPlanQueued'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INVALID_STATE, JOB_ALREADY_RUNNING or APPROVAL_REQUIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_STATE, message: "This step can't be retried. Please edit your idea or storyboard instead.", details: { jobState: failed, retryable: false }, requestId: req_01JCXM3G1H2J }
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      summary: Cancel a running job
      description: E3. For queued/running plan, revise, generate and caption jobs. Sets cancelRequestedAt; poll until cancelled. Repeat calls are harmless. Rate limit 30/hour.
      tags: [Jobs]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                cancelling:
                  $ref: '#/components/examples/JobGenerateRunning'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INVALID_STATE (already finished, or a publish job).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_STATE, message: This job has already finished., details: { jobState: succeeded }, requestId: req_01JCXM3K3L4M }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

