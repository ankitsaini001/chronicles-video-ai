                summary: Schedule
                value: { mode: scheduled, renderId: 67330fa09f1e4b2a7c0d6f02, mp4Sha256: 'sha256:1f2e3d4c5b6a79880a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f', connectionId: 6733101a9f1e4b2a7c0d7a01, caption: "Ever wondered how ₹20 reaches the chaiwala in 2 seconds? Here's the journey of a UPI payment 👇\n\n#UPI #DigitalIndia #FinanceBasics", scheduledAt: '2026-11-13T19:00:00+05:30', expectedStateVersion: 9 }
              now:
