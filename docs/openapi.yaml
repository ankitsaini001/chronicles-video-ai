openapi: 3.1.0
info:
  title: ByteReel API
  version: 1.0.0
  summary: HTTP API of the ByteReel V1 web application (REST JSON under /api/v1 + Better Auth under /api/auth).
  description: |
    Machine-readable mirror of `docs/API.md` (version 1.0, 2026-11-12, status: **Draft for founder review**).
    `docs/API.md` is the source of truth for behaviour, flows and user-facing messages.

    - All application endpoints are REST JSON route handlers under `/api/v1` (PRD decisions log #21).
    - Better Auth is mounted at `/api/auth/*`; its errors use Better Auth's own body `{ code, message }`.
      All `/api/v1` errors use the envelope `{ error: { code, message, details?, requestId } }`.
    - CSRF: SameSite=Lax session cookie + an `Origin` check on every mutating request
      (`POST`, `PUT`, `PATCH`, `DELETE`) to `/api/v1/*` and `/api/auth/*`. Meta callbacks are exempt
      (HMAC `signed_request`).
    - Slow work answers `202 Accepted` with a `Job`; poll `GET /api/v1/projects/{projectId}/status` or
      `GET /api/v1/jobs/{jobId}` every 2 s while `pollAfterMs` is not null.
    - Endpoints that start jobs or publish require an `Idempotency-Key` header; project mutations require
      `expectedStateVersion` (body) or `If-Match` (header).
    - **Internal, not listed here:** `GET/POST/PUT /api/inngest` (Inngest serve handler, verified with the
      Inngest signing key). **Conditional, not listed:** `GET /api/v1/media/{token}` (only built if Meta
      rejects presigned R2 URLs for `video_url`, decision D5).
  license:
    name: Proprietary (TechByte Chronicles)
    url: https://bytereel.app/terms
  contact:
    name: ByteReel team
    url: https://bytereel.app
servers:
  - url: https://bytereel.app
    description: Production (placeholder domain; domain check pending)
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
    description: Better Auth email + password endpoints (sign-up with allow-list, login, logout, session, change/reset password).
  - name: Account
    description: Current user, defaults, voice presets and account deletion.
  - name: Notifications
    description: In-app notifications (no email in V1).
  - name: Projects
    description: Project library, ① Idea, brainstorm, project detail and 2-second status polling.
  - name: Storyboard
    description: ② Plan versions, narration edits, voice switch, revision chat, undo/restore and storyboard approval.
  - name: Jobs
    description: Background job status, retry and cancel.
  - name: Video
    description: ③ Render versions, presigned media URLs and caption correction.
  - name: Instagram
    description: Instagram connection (OAuth with Instagram Login), status and disconnect.
  - name: Publish
    description: ④ AI caption suggestions, publish now / schedule (approval #2), post status, cancel and retry.
  - name: Admin
    description: Admin-only allow-list, users, reset links, jobs, usage and settings.
  - name: Meta
    description: Meta deauthorize and data-deletion callbacks (signed_request) and the public deletion status.
paths:
  # =============================== Auth (Better Auth) ===============================
  /api/auth/sign-up/email:
    post:
      operationId: signUpEmail
      summary: Sign up (allow-listed emails only)
      description: |
        A1. Creates an account and signs in. The email must be on the allow-list (`NOT_ALLOWLISTED` otherwise).
        Password 8–128 chars. Rate limit 5 / 15 min per IP. Origin check. Errors use Better Auth's `{ code, message }`.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example: { name: Ananya Iyer, email: ananya.iyer@example.in, password: Chai-and-Physics-2026 }
      responses:
        '200':
          description: Account created and signed in (Set-Cookie).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                token: Qm9yZWVsU2Vzc2lvbl9leGFtcGxl
                user: { id: 67330c1a9f1e4b2a7c0d1e01, name: Ananya Iyer, email: ananya.iyer@example.in, emailVerified: false, image: null, role: creator, status: active, timezone: Asia/Kolkata, defaultLanguage: en, defaultVoiceGender: female, createdAt: '2026-11-12T04:30:00.000Z', updatedAt: '2026-11-12T04:30:00.000Z' }
        '400':
          $ref: '#/components/responses/BetterAuthBadRequest'
        '403':
          description: NOT_ALLOWLISTED or FORBIDDEN_ORIGIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: NOT_ALLOWLISTED, message: ByteReel is in private beta — request access }
        '422':
          description: USER_ALREADY_EXISTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: USER_ALREADY_EXISTS, message: An account with this email already exists. Log in instead. }
        '429':
          $ref: '#/components/responses/BetterAuthTooMany'
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Log in
      description: |
        A2. Rate limit 5 / 15 min per IP and per email; 10 consecutive failures lock the account for 15 min
        (answered with the same `TOO_MANY_ATTEMPTS` as the rate limit). Wrong email or password always gives
        "Email or password is incorrect". Origin check.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example: { email: ananya.iyer@example.in, password: Chai-and-Physics-2026 }
      responses:
        '200':
          description: Signed in (Set-Cookie).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                redirect: false
                token: Qm9yZWVsU2Vzc2lvbl9leGFtcGxl
                user: { id: 67330c1a9f1e4b2a7c0d1e01, name: Ananya Iyer, email: ananya.iyer@example.in, role: creator, status: active }
        '401':
          description: INVALID_EMAIL_OR_PASSWORD (generic message, no enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: INVALID_EMAIL_OR_PASSWORD, message: Email or password is incorrect }
        '403':
          description: ACCOUNT_SUSPENDED (after a correct password) or FORBIDDEN_ORIGIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: ACCOUNT_SUSPENDED, message: Your account is paused. Contact the ByteReel team. }
        '429':
          $ref: '#/components/responses/BetterAuthTooMany'
  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: Log out
      description: A3. Deletes the current session and clears the cookie. Origin check.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
              example: { success: true }
        '401':
          $ref: '#/components/responses/BetterAuthUnauthorized'
        '403':
          $ref: '#/components/responses/BetterAuthForbiddenOrigin'
  /api/auth/get-session:
    get:
      operationId: getSession
      summary: Current session
      description: A4. Returns the session + user, or `null` when anonymous. Refreshes the rolling 30-day expiry when older than 1 day. Rate limit 120/min per IP.
      tags: [Auth]
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Session and user, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [session, user]
                    properties:
                      session:
                        $ref: '#/components/schemas/BetterAuthSession'
                      user:
                        $ref: '#/components/schemas/BetterAuthUser'
                  - type: 'null'
              example:
                session: { id: 67330c1b9f1e4b2a7c0d1f01, userId: 67330c1a9f1e4b2a7c0d1e01, expiresAt: '2026-12-12T04:30:00.000Z', createdAt: '2026-11-12T04:30:00.000Z', updatedAt: '2026-11-12T04:30:00.000Z' }
                user: { id: 67330c1a9f1e4b2a7c0d1e01, name: Ananya Iyer, email: ananya.iyer@example.in, role: creator, status: active, timezone: Asia/Kolkata }
        '429':
          $ref: '#/components/responses/BetterAuthTooMany'
  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: Change password
      description: A5. Requires the current password; `revokeOtherSessions` is forced to true (all other sessions are deleted). Rate limit 5 / 15 min per user. Origin check.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example: { currentPassword: Chai-and-Physics-2026, newPassword: Monsoon-Maths-Notes-77, revokeOtherSessions: true }
      responses:
        '200':
          description: Password changed; the current session gets a new token (Set-Cookie).
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example: { token: TmV3U2Vzc2lvblRva2Vu, user: { id: 67330c1a9f1e4b2a7c0d1e01, email: ananya.iyer@example.in } }
        '400':
          description: INVALID_PASSWORD, PASSWORD_TOO_SHORT or PASSWORD_TOO_LONG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: INVALID_PASSWORD, message: Your current password is incorrect. }
        '401':
          $ref: '#/components/responses/BetterAuthUnauthorized'
        '403':
          $ref: '#/components/responses/BetterAuthForbiddenOrigin'
        '429':
          $ref: '#/components/responses/BetterAuthTooMany'
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with an admin-issued reset token
      description: A6. One-time token from an admin-issued link (valid 1 h). On success the token is deleted and all sessions of the user are revoked. Rate limit 5 / 15 min per IP. Origin check.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example: { token: x7Qp2sVb9LmN4cRt8wYz1aBcDeFgHiJk3LmNoPqRsTu, newPassword: Monsoon-Maths-Notes-77 }
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: boolean
              example: { status: true }
        '400':
          description: INVALID_TOKEN, PASSWORD_TOO_SHORT or PASSWORD_TOO_LONG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetterAuthError'
              example: { code: INVALID_TOKEN, message: This reset link is invalid or has expired. Ask the ByteReel team for a new one. }
        '403':
          $ref: '#/components/responses/BetterAuthForbiddenOrigin'
        '429':
          $ref: '#/components/responses/BetterAuthTooMany'

  # =============================== Account ===============================
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user, usage and alerts
      description: B1. Profile, defaults, quotas, Instagram badge, unread notifications, maintenance flag. Rate limit 300/min.
      tags: [Account]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/MeAnanya'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updateMe
      summary: Update name, timezone and defaults
      description: B2. At least one field. Rate limit 30/min. Origin check.
      tags: [Account]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example: { defaultLanguage: hinglish, defaultVoiceGender: male }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/MeAnanya'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteAccount
      summary: Delete account (asynchronous cascade)
      description: |
        B3. Re-authenticates with the password and `confirm: "DELETE"`. Marks the user `deleting`, revokes all
        sessions, cancels scheduled posts, then the `delete-account` Inngest function deletes R2 data, the
        Instagram token and all owner-scoped records. **Idempotency-Key required.** Rate limit 3/hour.
        409 INVALID_STATE while a post is publishing.
      tags: [Account]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example: { password: Monsoon-Maths-Notes-77, confirm: DELETE }
      responses:
        '202':
          description: Deletion accepted; the session cookie is cleared.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionAccepted'
              example: { deletionRequestId: 673312aa9f1e4b2a7c0d9c01, status: pending, requestedAt: '2026-11-12T10:00:00.000Z' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Wrong password (FORBIDDEN, details.reason = wrong_password) or Origin check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: FORBIDDEN, message: Your password is incorrect., details: { reason: wrong_password }, requestId: req_01JCXM0G5H6J }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/voices:
    get:
      operationId: listVoices
      summary: Voice presets with preview samples
      description: B4. Pre-recorded static MP3 samples (decision D7). Voice IDs are never exposed.
      tags: [Account]
      security:
        - sessionCookie: []
      parameters:
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: Voice presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'
              example:
                items:
                  - { preset: hindi-female, language: hi, gender: female, label: महिला आवाज़ (Female), sampleUrl: /voices/hindi-female.mp3, sampleText: नमस्ते! आज हम समझेंगे कि इंद्रधनुष कैसे बनता है।, enabled: true }
                  - { preset: hindi-male, language: hi, gender: male, label: पुरुष आवाज़ (Male), sampleUrl: /voices/hindi-male.mp3, sampleText: नमस्ते! आज हम समझेंगे कि इंद्रधनुष कैसे बनता है।, enabled: true }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  # =============================== Notifications ===============================
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: In-app notifications
      description: B5. Sorted by createdAt desc. Cursor pagination.
      tags: [Notifications]
      security:
        - sessionCookie: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                  - { id: 673310f19f1e4b2a7c0d9a01, type: video_ready, projectId: 67330d5e9f1e4b2a7c0d2a10, postId: null, title: Your video is ready, message: '"How UPI payments work" is ready to review.', readAt: null, createdAt: '2026-11-12T05:46:12.000Z' }
                nextCursor: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/notifications/mark-read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read
      description: B6. Send exactly one of `ids` (1–100) or `all true`. Foreign or unknown ids are ignored. Rate limit 30/min.
      tags: [Notifications]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
            example: { ids: [673310f19f1e4b2a7c0d9a01] }
      responses:
        '200':
          description: Number of notifications updated.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    minimum: 0
              example: { updated: 1 }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  # =============================== Projects ===============================
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Project library
      description: |
        C1. Tabs: drafts (draft, planning, plan_failed, storyboard_ready, generating, generate_failed), ready
        (video_ready, publish_failed), scheduled (scheduled, publishing), published. Omitted = all non-archived.
        Sorted by updatedAt desc. Cursor pagination.
      tags: [Projects]
      security:
        - sessionCookie: []
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [drafts, ready, scheduled, published]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummaryPage'
              example:
                items:
                  - { id: 67330d5e9f1e4b2a7c0d2a10, title: How UPI payments work, language: en, voiceGender: female, state: video_ready, currentStep: video, thumbnailUrl: 'https://bytereel-prod.r2.example-account.r2.cloudflarestorage.com/users/67330c1a9f1e4b2a7c0d1e01/projects/67330d5e9f1e4b2a7c0d2a10/renders/67330f109f1e4b2a7c0d6f01/thumbnail.jpg?X-Amz-Expires=900&X-Amz-Signature=3f1c', latestPost: null, activeJobType: null, createdAt: '2026-11-12T05:00:00.000Z', updatedAt: '2026-11-12T05:46:12.000Z' }
                nextCursor: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: createProject
      summary: Create a project and start the storyboard
      description: |
        C2. ① Create storyboard. Creates the project (state planning) and a `plan` job; answers 202.
        **Idempotency-Key required.** Rate limit 10/hour; quota 5 projects/day (429 QUOTA_EXCEEDED);
        503 SPEND_CEILING / MAINTENANCE.
      tags: [Projects]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            examples:
              topic:
                summary: Topic
                value: { inputType: topic, text: How UPI payments work — from scanning the QR code to money reaching the shop, language: en, voiceGender: female }
              brainstorm:
                summary: Chosen brainstorm idea
                value: { inputType: brainstorm, text: "Why the monsoon reaches Kerala first. Every June, Kerala gets wet before Delhi.", language: en, voiceGender: female, brainstormChoice: { subject: Indian monsoon, title: Why the monsoon reaches Kerala first, hook: 'Every June, Kerala gets wet before Delhi. The reason is a giant sea breeze.' } }
      responses:
        '202':
          description: Project created; plan job queued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAndJob'
              examples:
                created:
                  summary: Project + plan job
                  value:
                    project: { id: 67330d5e9f1e4b2a7c0d2a10, title: How UPI payments work — from scanning the QR code to money reaching the shop, language: en, voiceGender: female, state: planning, currentStep: idea, thumbnailUrl: null, latestPost: null, activeJobType: plan, input: { type: topic, text: How UPI payments work — from scanning the QR code to money reaching the shop, brainstormChoice: null }, stateVersion: 1, currentPlanVersionId: null, approvedPlanVersionId: null, currentRenderId: null, activeJobId: 67330d5f9f1e4b2a7c0d3c01, activeJob: null, lastError: null, allowedActions: [cancel_job], archivedAt: null, createdAt: '2026-11-12T05:00:00.000Z', updatedAt: '2026-11-12T05:00:00.000Z' }
                    job: { id: 67330d5f9f1e4b2a7c0d3c01, projectId: 67330d5e9f1e4b2a7c0d2a10, type: plan, state: queued, attempt: 1, stages: [ { name: plan, status: pending, startedAt: null, endedAt: null, attempts: 0, error: null }, { name: validate, status: pending, startedAt: null, endedAt: null, attempts: 0, error: null } ], progress: { stage: plan, percent: 0, message: Writing your storyboard… }, error: null, needsInput: null, result: null, cancelRequestedAt: null, createdAt: '2026-11-12T05:00:00.000Z', updatedAt: '2026-11-12T05:00:00.000Z', startedAt: null, finishedAt: null, pollAfterMs: 2000 }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: IDEMPOTENCY_IN_PROGRESS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: IDEMPOTENCY_IN_PROGRESS, message: Still working on your previous click. Please wait a moment., requestId: req_01JCXKZZ0007 }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
