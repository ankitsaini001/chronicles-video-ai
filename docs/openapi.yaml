            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INVALID_STATE (render not ready).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_STATE, message: This video is still being made., details: { renderStatus: rendering }, requestId: req_01JCXM3V9W0X }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/projects/{projectId}/renders/{renderId}/caption-overrides:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RenderIdOrCurrent'
    post:
      operationId: saveCaptionOverrides
      summary: Caption correction (re-render without new speech)
      description: |
        F4. Saves a new caption-override set and starts a `caption` job (compile + render + validate).
        renderId must be the current render. **Idempotency-Key and expectedStateVersion required.**
        Does NOT count toward 3 videos/day and never returns QUOTA_EXCEEDED (decision #24a: only generate jobs count).
        409: STALE_VERSION, INVALID_STATE, JOB_ALREADY_RUNNING. 503 SPEND_CEILING. Rate limit 10/hour (429 RATE_LIMITED).
      tags: [Video]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptionOverridesRequest'
            example: { edits: [ { sceneId: scene-flow, phraseIndex: 1, text: to NPCI — the national switch } ], expectedStateVersion: 7 }
      responses:
        '202':
          description: Override set saved; caption job queued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptionOverridesResult'
              example:
                captionOverrideSetId: 67330fa09f1e4b2a7c0d7b01
                job: { id: 67330fa09f1e4b2a7c0d3c04, projectId: 67330d5e9f1e4b2a7c0d2a10, type: caption, state: queued, attempt: 1, stages: [ { name: compile, status: pending, startedAt: null, endedAt: null, attempts: 0, error: null }, { name: render, status: pending, startedAt: null, endedAt: null, attempts: 0, error: null }, { name: validate, status: pending, startedAt: null, endedAt: null, attempts: 0, error: null } ], progress: { stage: compile, percent: 0, message: Updating captions… }, error: null, needsInput: null, result: null, cancelRequestedAt: null, createdAt: '2026-11-12T06:02:00.000Z', updatedAt: '2026-11-12T06:02:00.000Z', startedAt: null, finishedAt: null, pollAfterMs: 2000 }
                project: { id: 67330d5e9f1e4b2a7c0d2a10, title: How UPI payments work, language: en, voiceGender: female, state: generating, currentStep: video, thumbnailUrl: null, latestPost: null, activeJobType: caption, input: { type: topic, text: How UPI payments work — from scanning the QR code to money reaching the shop, brainstormChoice: null }, stateVersion: 8, currentPlanVersionId: 67330e019f1e4b2a7c0d2b02, approvedPlanVersionId: 67330e019f1e4b2a7c0d2b02, currentRenderId: 67330f109f1e4b2a7c0d6f01, activeJobId: 67330fa09f1e4b2a7c0d3c04, activeJob: null, lastError: null, allowedActions: [cancel_job, download], archivedAt: null, createdAt: '2026-11-12T05:00:00.000Z', updatedAt: '2026-11-12T06:02:00.000Z' }
        '400':
          description: INVALID_INPUT (unknown phrase, wrong script).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_INPUT, message: Please check the highlighted captions., details: { issues: [ { path: 'edits[0].phraseIndex', message: 'scene "scene-flow" has phrases 0-4; 7 does not exist' } ] }, requestId: req_01JCXM3Z1A2B }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  # =============================== Instagram ===============================
  /api/v1/instagram/connection:
    get:
      operationId: getInstagramConnection
      summary: Instagram connection status
      description: G1. The connection or null. The access token is never returned.
      tags: [Instagram]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Connection (or null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
              examples:
                active:
                  $ref: '#/components/examples/ConnectionActive'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: disconnectInstagram
      summary: Disconnect Instagram
      description: G4. Removes the encrypted token, marks the connection revoked and invalidates scheduled posts. 409 INVALID_STATE while a post is publishing.
      tags: [Instagram]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The revoked connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
              example:
                connection: { id: 6733101a9f1e4b2a7c0d7a01, igUserId: '17841400000000001', username: physics.with.ananya, accountType: MEDIA_CREATOR, profilePictureUrl: null, status: revoked, tokenExpiresAt: '2027-01-11T06:10:00.000Z', connectedAt: '2026-11-12T06:10:00.000Z', lastRefreshedAt: '2026-11-12T06:10:00.000Z' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND (no connection).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: NOT_FOUND, message: No Instagram account is connected., requestId: req_01JCXM4G7H8J }
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/instagram/connect:
    get:
      operationId: startInstagramConnect
      summary: Start Instagram OAuth (browser navigation)
      description: G2. Builds a signed, session-bound `state` (10 min) and redirects to Instagram's authorize URL with scopes instagram_business_basic and instagram_business_content_publish. Rate limit 10/hour.
      tags: [Instagram]
      security:
        - sessionCookie: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: '^(settings|publish:[0-9a-f]{24})$'
            default: settings
      responses:
        '302':
          description: Redirect to www.instagram.com/oauth/authorize (or to /login without a session).
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/instagram/callback:
    get:
      operationId: instagramCallback
      summary: Instagram OAuth callback
      description: |
        G3. Verifies `state` (signature, expiry, current session), exchanges the code for a long-lived token,
        requires a BUSINESS or MEDIA_CREATOR account, encrypts and stores the token. Always answers with a 302
        back to the returnTo page: `?instagram=connected` or `?instagram_error=INSTAGRAM_ACCOUNT_INELIGIBLE` /
        `?instagram_error=INSTAGRAM_OAUTH_FAILED&reason=access_denied|invalid_state|exchange_failed`.
      tags: [Instagram]
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_reason
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to /settings or /projects/{id}/publish with a result query.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/InvalidInput'

  # =============================== Publish ===============================
  /api/v1/projects/{projectId}/caption-suggestions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: suggestCaption
      summary: AI Instagram caption and hashtags
      description: H1. Synchronous Gemini call (30 s timeout) in the project language; not stored. Rate limit 10/hour. 409 INVALID_STATE (render not ready); 422 PROVIDER_REJECTED; 503 PROVIDER_BUSY / SPEND_CEILING.
      tags: [Publish]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptionSuggestionRequest'
            example: { renderId: current }
      responses:
        '200':
          description: Suggested caption.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptionSuggestion'
              example:
                caption: "Ever wondered how ₹20 reaches the chaiwala before you put your phone back in your pocket? Here's the 2-second journey of a UPI payment 👇"
                hashtags: ['#UPI', '#DigitalIndia', '#FinanceBasics', '#LearnOnInstagram', '#NPCI']
                language: en
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: PROVIDER_REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rejected:
                  $ref: '#/components/examples/ErrProviderRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          description: PROVIDER_BUSY, SPEND_CEILING or MAINTENANCE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  $ref: '#/components/examples/ErrProviderBusy'
  /api/v1/projects/{projectId}/posts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
