                error: { code: PLAN_INVALID, message: Some scenes need fixing before you can approve., details: { issues: [ { sceneId: scene-takeaway, path: 'scenes[2].events[1].anchor.phrase', message: 'phrase "your own bank" was not found in narration block "line-take"' } ] }, requestId: req_01JCXKZZ0008 }
