      description: |
        H2. The creator approves the exact render (renderId + mp4Sha256), destination (connectionId; igUserId is
        copied server side) and caption (captionHash computed server side). mode=now starts publishing;
        mode=scheduled needs scheduledAt between now + 10 min and now + 75 days.
        **Idempotency-Key and expectedStateVersion required.** Rate limit 10/hour.
        409: STALE_VERSION, APPROVAL_STALE (render_not_current, mp4_hash_mismatch, connection_changed),
        INSTAGRAM_NOT_CONNECTED, INSTAGRAM_TOKEN_EXPIRED, INVALID_STATE, JOB_ALREADY_RUNNING.
      tags: [Publish]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            examples:
