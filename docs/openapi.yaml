          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/admin/jobs:
    get:
      operationId: adminListJobs
      summary: List jobs (failed / stuck filters)
      description: I8. stuck = running with no update for more than 30 min. Sorted by updatedAt desc.
      tags: [Admin]
      security:
        - adminSession: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobState'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobType'
        - name: ownerId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: stuck
          in: query
          required: false
          schema:
            type: boolean
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/AdminLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobPage'
              example:
                items:
                  - { id: 67330d5f9f1e4b2a7c0d3c01, projectId: 67330d5e9f1e4b2a7c0d2a10, type: plan, state: failed, attempt: 1, stages: [], progress: { stage: plan, percent: 0, message: Our AI is very busy right now. }, error: { code: PROVIDER_BUSY, message: Gemini returned 503 three times, retryable: true }, needsInput: null, result: null, cancelRequestedAt: null, createdAt: '2026-11-12T05:00:00.000Z', updatedAt: '2026-11-12T05:03:05.000Z', startedAt: '2026-11-12T05:00:01.000Z', finishedAt: '2026-11-12T05:03:05.000Z', pollAfterMs: null, ownerId: 67330c1a9f1e4b2a7c0d1e01, ownerEmail: ananya.iyer@example.in, inngestRunId: 01JCXJZ8Y6V5T4S3R2Q1P0N9M8, idempotencyKey: 'plan:67330d5e9f1e4b2a7c0d2a10:sha256:3c4d' }
                nextCursor: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/admin/jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: adminRetryJob
      summary: Retry any user's job
      description: I9. Same rules as the creator retry (approval re-checked), also for failed publish jobs. **Idempotency-Key required.** 409 INVALID_STATE, JOB_ALREADY_RUNNING, APPROVAL_REQUIRED, APPROVAL_STALE.
      tags: [Admin]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '202':
          description: The job, queued again.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJob'
              examples:
                failedJob:
                  $ref: '#/components/examples/AdminJobFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INVALID_STATE, JOB_ALREADY_RUNNING, APPROVAL_REQUIRED or APPROVAL_STALE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: JOB_ALREADY_RUNNING, message: This project already has a running job., details: { activeJobId: 67330f109f1e4b2a7c0d3c03 }, requestId: req_01JCXM6G9H0J }
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/admin/usage:
    get:
      operationId: adminGetUsage
      summary: Spend, ceilings and metrics
      description: I10. Default range is today in IST; at most 92 days.
      tags: [Admin]
      security:
        - adminSession: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [provider, user, day]
            default: provider
      responses:
        '200':
          description: Usage report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
              example:
                from: '2026-11-11T18:30:00.000Z'
                to: '2026-11-12T18:30:00.000Z'
                totals: { estCostInr: 186.4, calls: 212 }
                groups:
                  - { key: gemini, calls: 61, units: { promptTokens: 512000, outputTokens: 148000, characters: 0, renderSeconds: 0 }, estCostInr: 22.1 }
                  - { key: elevenlabs, calls: 118, units: { promptTokens: 0, outputTokens: 0, characters: 19650, renderSeconds: 0 }, estCostInr: 98.0 }
                  - { key: vercel-sandbox, calls: 21, units: { promptTokens: 0, outputTokens: 0, characters: 0, renderSeconds: 5880 }, estCostInr: 66.3 }
                  - { key: meta, calls: 12, units: { promptTokens: 0, outputTokens: 0, characters: 0, renderSeconds: 0 }, estCostInr: 0 }
                ceilings:
                  - { name: elevenlabs_characters_month, used: 7420, limit: 9000, percent: 82.4, period: month }
                  - { name: gemini_requests_day, used: 61, limit: 400, percent: 15.3, period: day }
                  - { name: sandbox_render_minutes_day, used: 98, limit: 240, percent: 40.8, period: day }
                  - { name: spend_inr_day, used: 186.4, limit: 1000, percent: 18.6, period: day }
                metrics: { videosGenerated: 21, renderSuccessRate: 0.98, medianIdeaToVideoSeconds: 412, medianRenderSeconds: 268, avgRevisionsPerProject: 1.4, publishSuccessRate: 1.0 }
        '400':
          description: INVALID_INPUT (range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_INPUT, message: Please check the highlighted fields., details: { issues: [ { path: to, message: must be after from and at most 92 days later } ] }, requestId: req_01JCXM6K1L2M }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/admin/settings:
    get:
      operationId: adminGetSettings
      summary: Global settings
      description: I11. Limits, ceilings, models, enabled voices and maintenance mode.
      tags: [Admin]
      security:
        - adminSession: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                current:
                  $ref: '#/components/examples/SettingsV3'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: adminUpdateSettings
      summary: Update global settings
      description: I12. Full replacement with **expectedVersion** (409 STALE_VERSION when another admin saved first). Applies within 60 s (per-instance cache).
      tags: [Admin]
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
            example:
              expectedVersion: 3
              maintenance: { active: false, message: null }
              limits: { videosPerUserPerDay: 3, projectsPerUserPerDay: 5, planRequestsPerProject: 20, voiceCharactersPerUserPerMonth: 3000 }
              ceilings: { elevenLabsCharactersPerMonth: 9000, geminiRequestsPerDay: 400, sandboxRenderMinutesPerDay: 240, spendInrPerDay: 1000 }
              models: { planner: gemini-3.6-flash, speech: eleven_multilingual_v2 }
              voices: { enabledPresets: [indian-english-male, indian-english-female, hindi-male, hindi-female, hinglish-male, hinglish-female] }
      responses:
        '200':
          description: Updated settings (version + 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                updated:
                  $ref: '#/components/examples/SettingsV3'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '409':
          description: STALE_VERSION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: STALE_VERSION, message: Settings were changed by someone else. Reload and try again., details: { expectedVersion: 3, currentVersion: 4 }, requestId: req_01JCXM6R5S6T }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  # =============================== Meta ===============================
  /api/v1/meta/deauthorize:
    post:
      operationId: metaDeauthorize
      summary: Meta deauthorize callback
      description: |
        J1. Called by Meta with a form-encoded `signed_request` (HMAC-SHA256 with the app secret, verified in
        constant time). Marks matching connections revoked, deletes the token, invalidates scheduled posts.
        Exempt from the Origin check. Rate limit 60/min per IP.
      tags: [Meta]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignedRequestForm'
            example: { signed_request: Zm9vYmFyc2lnbmF0dXJl.eyJ1c2VyX2lkIjoiMTc4NDE0MDAwMDAwMDAwMDEiLCJhbGdvcml0aG0iOiJITUFDLVNIQTI1NiIsImlzc3VlZF9hdCI6MTc5NDkwMDAwMH0 }
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
              example: { received: true }
        '400':
          description: INVALID_SIGNATURE or INVALID_INPUT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_SIGNATURE, message: Invalid signed_request., requestId: req_01JCXM6V7W8X }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/meta/data-deletion:
    post:
      operationId: metaDataDeletion
      summary: Meta data-deletion callback
      description: |
        J2. Verifies `signed_request`, records a deletion request and deletes Meta-derived data (connection,
        IG ids/permalinks on posts, publish-attempt payloads). The ByteReel account and videos are not deleted.
        Answers with Meta's required snake_case body. Exempt from the Origin check.
      tags: [Meta]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignedRequestForm'
            example: { signed_request: Zm9vYmFyc2lnbmF0dXJl.eyJ1c2VyX2lkIjoiMTc4NDE0MDAwMDAwMDAwMDEiLCJhbGdvcml0aG0iOiJITUFDLVNIQTI1NiIsImlzc3VlZF9hdCI6MTc5NDkwMDAwMH0 }
      responses:
        '200':
          description: Status URL and confirmation code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaDataDeletionResponse'
              example: { url: 'https://bytereel.app/data-deletion/DEL-7K3M9Q2X', confirmation_code: DEL-7K3M9Q2X }
        '400':
          description: INVALID_SIGNATURE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: INVALID_SIGNATURE, message: Invalid signed_request., requestId: req_01JCXM6Z9A0B }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/meta/data-deletion/{confirmationCode}:
    parameters:
      - $ref: '#/components/parameters/ConfirmationCode'
    get:
      operationId: getDataDeletionStatus
      summary: Public data-deletion status
      description: J3. Used by the /data-deletion/{code} page that Meta links to. No personal data.
      tags: [Meta]
      security: []
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
              example: { confirmationCode: DEL-7K3M9Q2X, status: completed, requestedAt: '2026-11-12T08:00:00.000Z', completedAt: '2026-11-12T08:00:04.000Z' }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          description: NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: NOT_FOUND, message: "We couldn't find a deletion request with this code.", requestId: req_01JCXM7A1B2C }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        Better Auth session cookie (httpOnly, Secure, SameSite=Lax, 30-day rolling session). In local
        development (HTTP) the cookie is named `better-auth.session_token`. Any `active` user (creator or admin).
    adminSession:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: >-
        The same session cookie, belonging to a user with `role = admin`. The role is enforced server side;
        creators get `403 FORBIDDEN` (`details.reason = admin_only`).

  schemas:
    # ---------- primitives ----------
    ObjectId:
      type: string
      pattern: '^[0-9a-f]{24}$'
      description: MongoDB ObjectId as 24 lowercase hex characters.
      examples: ['67330d5e9f1e4b2a7c0d2a10']
    SafeId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
      description: Plan-internal id (packages/pipeline/src/contracts/common.ts SAFE_ID_PATTERN).
    Sha256:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC timestamp with milliseconds, e.g. 2026-11-12T09:30:00.000Z
    NullableTimestamp:
      type: [string, 'null']
      format: date-time

    # ---------- enums ----------
    Language:
      type: string
      enum: [en, hi, hinglish]
    VoiceGender:
      type: string
      enum: [female, male]
    VoicePreset:
      type: string
      enum: [indian-english-male, indian-english-female, hindi-male, hindi-female, hinglish-male, hinglish-female]
    SceneType:
      type: string
      enum: [title-hook, labeled-diagram, process-flow, comparison, timeline, chart, step-sequence, takeaway]
    ObjectKind:
      type: string
      description: Allowed kinds per pattern are defined by COMPONENT_CATALOG (packages/pipeline/src/planning/component-catalog.ts).
      enum: [headline, subtitle, icon, diagram, part, arrow, node, particles, column, point, axis, milestone, bar, line-point, pie-slice, counter, step, bullet]
    EventAction:
      type: string
      description: Allowed actions per pattern are defined by COMPONENT_CATALOG.
      enum: [appear, highlight, pulse, point-to, flow, rise, fall, speed-up, gather, check, cross, advance, grow, count-up, complete]
    IconName:
      type: string
      enum: [sun, raindrop, droplets, cloud, waves, snowflake, glass, mountain, layers, thermometer, flame, wind, leaf, globe, bulb, check, cross, clock, coin, bank, chart, book, flag, star, question, people, gear, dot]
    ProjectState:
      type: string
      enum: [draft, planning, plan_failed, storyboard_ready, generating, generate_failed, video_ready, scheduled, publishing, published, publish_failed, archived]
    ProjectStep:
      type: string
      enum: [idea, storyboard, video, publish]
    InputType:
      type: string
      enum: [topic, notes, brainstorm]
    PlanVersionSource:
      type: string
      description: caption_edit is reserved and not produced in V1.
      enum: [ai_plan, ai_revision, user_edit, caption_edit]
    JobType:
      type: string
      enum: [plan, revise, generate, caption, publish]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, needs_input, cancelled]
    StageName:
      type: string
      enum: [plan, validate, approve, speech, compile, render, create_container, poll, publish, reconcile]
    StageStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped, cancelled]
    RevisionStage:
      type: string
      enum: [storyboard, video]
    RevisionScope:
      type: string
      enum: [project, scene]
    RevisionStatus:
      type: string
      enum: [pending, succeeded, failed, rejected]
    RenderStatus:
      type: string
      enum: [pending, rendering, validating, ready, failed]
    PostMode:
      type: string
      enum: [now, scheduled]
    PostState:
      type: string
      description: draft is reserved (not produced in V1).
      enum: [draft, scheduled, publishing, outcome_unknown, published, publish_failed, approval_invalidated, cancelled]
    ConnectionStatus:
      type: string
      enum: [active, expired, revoked, error]
    AllowedAction:
      type: string
      enum: [rename, archive, edit_storyboard, request_revision, approve_storyboard, cancel_job, retry_job, edit_captions, download, publish, cancel_post, retry_post]
    NotificationType:
      type: string
      enum: [storyboard_ready, video_ready, needs_input, generate_failed, post_published, post_failed, approval_invalidated, instagram_reconnect]
    UserRole:
      type: string
      enum: [creator, admin]
    UserStatus:
      type: string
      enum: [active, suspended, deleting]
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_INPUT
        - PAYLOAD_TOO_LARGE
        - PLAN_INVALID
        - STALE_VERSION
        - INVALID_STATE
        - ALREADY_EXISTS
        - JOB_ALREADY_RUNNING
        - APPROVAL_REQUIRED
        - APPROVAL_STALE
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - QUOTA_EXCEEDED
        - RATE_LIMITED
        - SPEND_CEILING
        - MAINTENANCE
        - PROVIDER_BUSY
        - PROVIDER_REJECTED
        - PROVIDER_UNAVAILABLE
        - NEEDS_INPUT
        - RENDER_FAILED
        - CANCELLED
        - INSTAGRAM_NOT_CONNECTED
        - INSTAGRAM_TOKEN_EXPIRED
        - INSTAGRAM_ACCOUNT_INELIGIBLE
        - INSTAGRAM_OAUTH_FAILED
        - PUBLISH_LIMIT_REACHED
        - PUBLISH_FAILED
        - INVALID_SIGNATURE
        - INTERNAL

    # ---------- errors ----------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Plain-language message, safe to show.
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
    BetterAuthError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [NOT_ALLOWLISTED, USER_ALREADY_EXISTS, PASSWORD_TOO_SHORT, PASSWORD_TOO_LONG, INVALID_EMAIL, INVALID_EMAIL_OR_PASSWORD, TOO_MANY_ATTEMPTS, ACCOUNT_SUSPENDED, INVALID_PASSWORD, INVALID_TOKEN, FORBIDDEN_ORIGIN, UNAUTHORIZED]
        message:
          type: string
    LastError:
      type: [object, 'null']
      required: [code, message, at]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        at:
          $ref: '#/components/schemas/Timestamp'

    # ---------- plan contract (packages/pipeline/src/contracts/plan.ts) ----------
    NarrationBlock:
      type: object
      additionalProperties: false
      required: [id, text, speech, display]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: Approved wording (SCENE_LIMITS.maxNarrationBlockLength = 300).
        speech:
          type: [string, 'null']
          minLength: 1
          description: Pronunciation form sent to TTS; null = same as text.
        display:
          type: [string, 'null']
          minLength: 1
          description: Caption form; null = same as text.
    VisualObject:
      type: object
      additionalProperties: false
      required: [id, kind, label, value]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        kind:
          $ref: '#/components/schemas/ObjectKind'
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: headline/subtitle/point/step/bullet ≤ 60, other kinds ≤ 32 (semantic validation).
        icon:
          $ref: '#/components/schemas/IconName'
          description: Optional; omitted when no icon.
        value:
          type: [number, 'null']
          description: Required number for bar, line-point, pie-slice, counter; null for every other kind.
    SceneEventAnchor:
      type: object
      additionalProperties: false
      required: [narrationId, phrase]
      properties:
        narrationId:
          $ref: '#/components/schemas/SafeId'
        phrase:
          type: string
          minLength: 1
    SceneEvent:
      type: object
      additionalProperties: false
      required: [id, anchor, action, target]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        anchor:
          $ref: '#/components/schemas/SceneEventAnchor'
        action:
          $ref: '#/components/schemas/EventAction'
        target:
          $ref: '#/components/schemas/SafeId'
    Scene:
      type: object
      additionalProperties: false
      required: [id, type, narration, objects, events]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        type:
          $ref: '#/components/schemas/SceneType'
        narration:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/NarrationBlock'
        objects:
          type: array
          description: Count limits per pattern (COMPONENT_CATALOG minObjects/maxObjects).
          items:
            $ref: '#/components/schemas/VisualObject'
        events:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SceneEvent'
    Source:
      type: object
      additionalProperties: false
      required: [id, title, notes]
      properties:
        id:
          $ref: '#/components/schemas/SafeId'
        title:
          type: string
          minLength: 1
        notes:
          type: string
          maxLength: 20000
    PlanWarning:
      type: object
      additionalProperties: false
      required: [sceneId, message]
      properties:
        sceneId:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        message:
          type: string
          minLength: 1
    Plan:
      type: object
      additionalProperties: false
      description: Plan contract v1 (PLAN_SCHEMA_VERSION). Semantic rules (3–10 scenes, first title-hook, last takeaway, anchors, catalog limits, 60–90 s estimate, script rules) are reported in PlanVersion.validation.
      required: [schemaVersion, projectId, ownerId, versionId, parentVersionId, topic, audience, learningObjective, language, voicePreset, sources, scenes, warnings]
      properties:
        schemaVersion:
          type: integer
          const: 1
        projectId:
          $ref: '#/components/schemas/SafeId'
        ownerId:
          $ref: '#/components/schemas/SafeId'
        versionId:
          $ref: '#/components/schemas/SafeId'
        parentVersionId:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        topic:
          type: string
          minLength: 1
          maxLength: 200
        audience:
          type: string
          minLength: 1
          maxLength: 200
        learningObjective:
          type: string
          minLength: 1
          maxLength: 300
        language:
          $ref: '#/components/schemas/Language'
        voicePreset:
          $ref: '#/components/schemas/VoicePreset'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        scenes:
          type: array
          minItems: 2
          maxItems: 12
          items:
            $ref: '#/components/schemas/Scene'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanWarning'
    ValidationIssue:
