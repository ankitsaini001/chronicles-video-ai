<style>
    .reel-gradient-text {
      background: linear-gradient(180deg, #FFE2A8 0%, #F5B04A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .amber-btn-gradient {
      background: linear-gradient(180deg, #F7B44A 0%, #E8901A 100%);
    }
    .amber-atmosphere {
      background-image: radial-gradient(circle at 50% 45%, #F5A52418 0%, transparent 60%);
    }
  </style>
</head>
<body class="bg-bg text-text min-h-screen flex flex-col items-center justify-between font-body antialiased relative selection:bg-primary-container selection:text-on-amber">
<!-- Subtle Radial Amber Ambience Glow -->
<div class="fixed inset-0 amber-atmosphere pointer-events-none z-0"></div>
<!-- Main Centered Content Canvas -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-12 relative z-10">
<!-- Auth Card -->
<div class="w-full max-w-[440px] bg-surface rounded-[16px] border border-line px-8 py-10 shadow-[0_20px_50px_#00000066] transition-all duration-300">
<!-- 1. Logo Cluster -->
<div class="flex items-center justify-center gap-3">
<!-- Play Halo Icon Circle -->
<div class="w-10 h-10 rounded-full bg-[#1A1A2E] flex items-center justify-center shadow-[0_0_15px_#F5A5244D] border border-line">
<span class="material-symbols-outlined text-primary-container text-xl ml-0.5" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<!-- Wordmark -->
<span class="font-display text-h3 tracking-tight font-extrabold text-text inline-flex items-center">
          Byte<span class="reel-gradient-text">Reel</span>
</span>
</div>
<!-- 2. Heading -->
<h1 class="font-h2 text-h2 font-extrabold text-text text-center tracking-tight mt-6 mb-2">
        Welcome back
      </h1>
<!-- 3. Subtext -->
<p class="font-small text-small text-text-muted text-center mb-8">
        Log in to keep creating.
      </p>
<!-- 4. Form Fields -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Field 1: Email -->
<div>
<label class="font-small text-small font-medium text-text block mb-2 text-left" for="email">
            Email
          </label>
<input class="w-full h-[52px] px-4 bg-surface-2 border border-line rounded-[16px] text-text font-body text-body placeholder-text-muted/50 focus:outline-none focus:border-gold-cream focus:ring-1 focus:ring-gold-cream transition-all duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Field 2: Password -->
<div>
<label class="font-small text-small font-medium text-text block mb-2 text-left" for="password">
            Password
          </label>
<div class="w-full h-[52px] px-4 bg-surface-2 border border-line rounded-[16px] flex items-center justify-between focus-within:border-gold-cream focus-within:ring-1 focus-within:ring-gold-cream transition-all duration-200">
<input class="w-full bg-transparent border-0 p-0 text-text font-body text-body placeholder-text-muted/50 focus:ring-0 focus:outline-none" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="text-text-muted hover:text-text transition-colors p-1 flex items-center justify-center focus:outline-none" id="togglePassword" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" id="eyeIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- 5. Primary Button -->
<button class="w-full rounded-full h-[52px] mt-8 amber-btn-gradient flex items-center justify-center relative shadow-[0_10px_30px_#F5A52466] hover:shadow-[0_12px_35px_#F5A52480] hover:-translate-y-0.5 active:scale-95 active:translate-y-0 transition-all duration-150 cursor-pointer group" type="submit">
<span class="font-body text-body-lg font-bold text-on-amber tracking-tight">
            Log in
          </span>
<div class="absolute right-2 w-9 h-9 rounded-full bg-black/15 flex items-center justify-center group-hover:bg-black/20 transition-colors">
<span class="text-on-amber font-bold text-base leading-none">↗</span>
</div>
</button>
</form>
<!-- 6. Inside card below button -->
<p class="font-small text-small text-text-muted text-center mt-5">
        Forgot your password? <a class="text-text-muted hover:text-gold-cream transition-colors duration-150" href="#">Contact the ByteReel team.</a>
</p>
</div>
<!-- 7. Row below card -->
<div class="mt-8 text-center">
<span class="font-small text-small text-text-muted">New here? </span>
<a class="font-small text-small text-primary-container font-medium hover:underline hover:text-gold-cream transition-colors" href="#">
        Create an account
      </a>
</div>
</main>
<!-- 8. Footer Link / Legal Anchor -->
<footer class="w-full py-6 text-center relative z-10">
<div class="inline-flex items-center gap-2 font-small text-small text-text-muted transition-colors">
<a class="hover:text-text transition-colors" href="#">Privacy</a>
<span>·</span>
<a class="hover:text-text transition-colors" href="#">Terms</a>
</div>
</footer>
<!-- Micro-interaction: Password Toggle Logic -->
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

        if (isPassword) {
          // Change to Eye Off SVG
          eyeIcon.innerHTML = `
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          `;
        } else {
          // Restore regular Eye SVG
          eyeIcon.innerHTML = `
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          `;
        }
      });
    }
  </script>
</body></html>
