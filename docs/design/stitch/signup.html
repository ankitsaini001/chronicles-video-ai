<body class="bg-bg text-text min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden selection:bg-primary-container selection:text-on-amber">
<!-- Subtle Studio Amber Ambient Radial Lighting -->
<div class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(circle_at_50%_40%,rgba(245,165,36,0.12),transparent_60%)]"></div>
<!-- Top Spacing Balancing -->
<div class="w-full h-8"></div>
<!-- Main Focus Container -->
<main class="w-full flex flex-col items-center justify-center px-4 relative z-10 py-6">
<!-- Center Signup Card -->
<div class="w-full max-w-[440px] bg-surface border border-line rounded-[16px] p-8 md:p-10 shadow-[0_20px_50px_#00000066]">
<!-- Card Header -->
<div class="flex flex-col items-center text-center mb-8">
<!-- Logo -->
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 rounded-full bg-[#1A1A2E] flex items-center justify-center border border-line shadow-inner">
<span class="material-symbols-outlined text-primary-container text-[20px] ml-0.5" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<span class="font-display text-h3 tracking-tight font-extrabold flex items-center">
<span class="text-text">Byte</span>
<span class="bg-gradient-to-b from-[#FFE2A8] to-[#F5B04A] bg-clip-text text-transparent">Reel</span>
</span>
</div>
<!-- Heading -->
<h1 class="font-h2 text-[28px] leading-tight font-bold text-text mb-2 tracking-tight">Create your account</h1>
<!-- Beta Notice Subtitle -->
<p class="font-body text-[14px] leading-relaxed text-text-muted max-w-[340px]">
          ByteReel is in private beta. Use the email you were invited with.
        </p>
</div>
<!-- Signup Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Field 1: Name -->
<div class="space-y-2 text-left">
<label class="block font-body text-[14px] font-medium text-text" for="name">Name</label>
<input class="w-full bg-surface-2 border border-line rounded-[16px] px-[18px] py-[14px] text-text placeholder-text-muted font-body text-[14px] focus:outline-none focus:ring-2 focus:ring-gold-cream focus:border-transparent transition-all" id="name" name="name" placeholder="Your name" required="" type="text"/>
</div>
<!-- Field 2: Email -->
<div class="space-y-2 text-left">
<label class="block font-body text-[14px] font-medium text-text" for="email">Email</label>
<input class="w-full bg-surface-2 border border-line rounded-[16px] px-[18px] py-[14px] text-text placeholder-text-muted font-body text-[14px] focus:outline-none focus:ring-2 focus:ring-gold-cream focus:border-transparent transition-all" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Field 3: Password -->
<div class="space-y-1.5 text-left">
<label class="block font-body text-[14px] font-medium text-text" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-2 border border-line rounded-[16px] pl-[18px] pr-12 py-[14px] text-text placeholder-text-muted font-body text-[14px] focus:outline-none focus:ring-2 focus:ring-gold-cream focus:border-transparent transition-all" id="password" name="password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-text-muted hover:text-text transition-colors flex items-center justify-center p-1" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility</span>
</button>
</div>
<p class="font-label text-label text-text-muted pt-0.5">8 to 128 characters</p>
</div>
<!-- Field 4: Confirm password -->
<div class="space-y-2 text-left">
<label class="block font-body text-[14px] font-medium text-text" for="confirm-password">Confirm password</label>
<div class="relative">
<input class="w-full bg-surface-2 border border-line rounded-[16px] pl-[18px] pr-12 py-[14px] text-text placeholder-text-muted font-body text-[14px] focus:outline-none focus:ring-2 focus:ring-gold-cream focus:border-transparent transition-all" id="confirm-password" name="confirm-password" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-text-muted hover:text-text transition-colors flex items-center justify-center p-1" id="toggle-confirm-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="confirm-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Action: Primary Pill Button -->
<div class="pt-2">
<button class="group w-full rounded-full bg-gradient-to-b from-[#F7B44A] to-[#E8901A] text-on-amber font-body font-bold text-[15px] p-1.5 pl-6 flex items-center justify-between shadow-[0_10px_25px_rgba(245,165,36,0.35)] hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-200" type="submit">
<span>Create account</span>
<div class="w-10 h-10 rounded-full bg-[#00000026] flex items-center justify-center text-on-amber font-bold text-lg group-hover:scale-105 transition-transform duration-200">
              ↗
            </div>
</button>
</div>
</form>
</div>
<!-- Below Card: Direct Login Redirection -->
<div class="mt-6 text-center">
<p class="font-body text-[14px] text-text-muted">
        Already have an account?
        <a class="text-primary-container font-medium hover:underline hover:text-gold-cream transition-colors ml-1" href="#login">Log in</a>
</p>
</div>
</main>
<!-- Screen Footer Utilities -->
<footer class="w-full py-6 text-center relative z-10">
<p class="font-small text-small text-text-muted space-x-2">
<a class="hover:text-gold-cream transition-colors" href="#privacy">Privacy</a>
<span>·</span>
<a class="hover:text-gold-cream transition-colors" href="#terms">Terms</a>
</p>
</footer>
<!-- Micro-interactions: Password Show/Hide Script -->
<script>
    function setupPasswordToggle(buttonId, inputId, iconId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (btn && input && icon) {
        btn.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    }

    setupPasswordToggle('toggle-password', 'password', 'password-eye-icon');
    setupPasswordToggle('toggle-confirm-password', 'confirm-password', 'confirm-eye-icon');
  </script>
