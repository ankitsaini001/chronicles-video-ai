<body class="bg-bg text-text min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden selection:bg-primary-container selection:text-on-amber">
<!-- Ambient Amber Lighting Glow -->
<div class="fixed inset-0 pointer-events-none z-0 flex items-center justify-center">
<div class="w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] transform -translate-y-12"></div>
</div>
<!-- Main Viewport Canvas -->
<main class="relative z-10 w-full flex-1 flex flex-col items-center justify-center px-4 py-12">
<!-- Centered Card -->
<div class="w-full max-w-[440px] bg-surface border border-line rounded-DEFAULT p-8 sm:p-10 shadow-[0_20px_50px_#00000066]">
<!-- Top Logo -->
<div class="flex items-center justify-center gap-2.5">
<div class="w-9 h-9 rounded-full bg-[#1A1A2E] flex items-center justify-center shadow-[0_0_15px_#F5A52433] border border-line/40">
<svg class="w-4 h-4 fill-primary-container ml-0.5" viewbox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
</div>
<span class="font-display font-extrabold text-h3 tracking-tight">
<span class="text-text">Byte</span><span class="bg-gradient-to-b from-gold-cream to-[#F5B04A] bg-clip-text text-transparent">Reel</span>
</span>
</div>
<!-- Heading -->
<h1 class="font-h2 text-h2 text-text text-center mt-6">Set a new password</h1>
<!-- Sub text -->
<p class="font-small text-small text-text-muted text-center mt-2 mb-6">Choose a new password for your ByteReel account.</p>
<!-- Form -->
<form class="w-full" onsubmit="event.preventDefault();">
<!-- Field 1: New password -->
<div>
<label class="block font-body text-body font-medium text-text mb-2" for="new-password">New password</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-2 border border-line rounded-DEFAULT text-text px-4 py-3.5 pr-11 placeholder:text-text-muted/40 font-body text-body focus:outline-none focus:ring-2 focus:ring-gold-cream transition-all duration-200" id="new-password" name="new_password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-text-muted hover:text-gold-cream transition-colors duration-200 focus:outline-none p-1" onclick="toggleVisibility('new-password', this)" type="button">
<svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
<span class="block font-label text-label text-text-muted mt-1.5">8 to 128 characters</span>
</div>
<!-- Field 2: Confirm new password -->
<div>
<label class="block font-body text-body font-medium text-text mt-4 mb-2" for="confirm-password">Confirm new password</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-2 border border-line rounded-DEFAULT text-text px-4 py-3.5 pr-11 placeholder:text-text-muted/40 font-body text-body focus:outline-none focus:ring-2 focus:ring-gold-cream transition-all duration-200" id="confirm-password" name="confirm_password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-text-muted hover:text-gold-cream transition-colors duration-200 focus:outline-none p-1" onclick="toggleVisibility('confirm-password', this)" type="button">
<svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- Primary button -->
<button class="w-full rounded-full bg-gradient-to-b from-[#F7B44A] to-amber-deep text-on-amber font-body font-bold py-3.5 px-6 mt-6 shadow-[0_10px_30px_#F5A52466] flex items-center justify-center gap-2 hover:-translate-y-0.5 active:scale-95 transition-all duration-150 cursor-pointer" type="submit">
<span>Set new password</span>
<span class="w-5 h-5 rounded-full bg-on-amber/15 flex items-center justify-center text-xs">↗</span>
</button>
<!-- Small muted text under the button -->
<p class="font-small text-small text-text-muted text-center mt-4">Link expired? Ask the ByteReel team for a new one.</p>
</form>
</div>
</main>
<!-- Very bottom of page -->
<footer class="relative z-10 w-full text-center pb-8">
<p class="font-small text-small text-text-muted">Privacy · Terms</p>
</footer>
<script>
    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      btn.innerHTML = isPassword ? `
        <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          <line x1="2" x2="22" y1="2" y2="22"/>
        </svg>
      ` : `
        <svg class="w-5 h-5 stroke-current fill-none stroke-[1.8]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;
    }
  </script>
</body></html>
