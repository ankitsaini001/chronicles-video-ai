<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c140d"/>
      <stop offset="100%" stop-color="#0f0b07"/>
    </linearGradient>
  </defs>
  <rect width="320" height="420" fill="url(#bgGrad4)"/>

  <!-- 1. Phone Node (User) Top -->
  <g transform="translate(136, 45)">
    <rect x="0" y="0" width="48" height="76" rx="8" fill="#241a10" stroke="#F5A524" stroke-width="2"/>
    <rect x="5" y="8" width="38" height="52" rx="3" fill="#140f0a"/>
    <circle cx="24" cy="67" r="3" fill="#F5A524"/>
    <!-- QR / scan icon inside screen -->
    <rect x="14" y="20" width="20" height="20" rx="2" fill="none" stroke="#FFE2A8" stroke-width="1.5"/>
  </g>

  <!-- Arrow Phone -> Bank -->
  <path d="M 160 130 L 160 170" fill="none" stroke="#F5A524" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="160,175 155,166 165,166" fill="#F5A524"/>

  <!-- 2. Bank / NPCI Central Node -->
  <g transform="translate(125, 185)">
    <rect x="0" y="0" width="70" height="60" rx="12" fill="#1f1810" stroke="#F5A524" stroke-width="2"/>
    <!-- Bank pillars icon -->
    <path d="M 15 22 L 35 12 L 55 22 Z" fill="#F5A524"/>
    <rect x="18" y="25" width="5" height="18" fill="#FFE2A8"/>
    <rect x="32" y="25" width="5" height="18" fill="#FFE2A8"/>
    <rect x="46" y="25" width="5" height="18" fill="#FFE2A8"/>
    <rect x="14" y="44" width="42" height="4" fill="#F5A524"/>
  </g>

  <!-- Arrow Bank -> Merchant -->
  <path d="M 160 255 L 160 295" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-dasharray="4 4"/>
  <polygon points="160,300 155,291 165,291" fill="#4ADE80"/>

  <!-- 3. Merchant / Store Node Bottom -->
  <g transform="translate(125, 310)">
    <rect x="0" y="0" width="70" height="60" rx="12" fill="#14261a" stroke="#4ADE80" stroke-width="2"/>
    <!-- Store awning icon -->
    <path d="M 16 22 L 54 22 L 50 34 L 20 34 Z" fill="#4ADE80"/>
    <rect x="22" y="34" width="26" height="16" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
    <!-- Checkmark badge -->
    <circle cx="58" cy="16" r="9" fill="#4ADE80"/>
    <path d="M 54 16 L 57 19 L 63 13" fill="none" stroke="#0f2e1e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Security / Instant speed signal arcs -->
  <path d="M 100 215 C 80 215 80 160 115 150" fill="none" stroke="#F5A524" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <path d="M 220 215 C 240 215 240 280 205 290" fill="none" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
</svg>