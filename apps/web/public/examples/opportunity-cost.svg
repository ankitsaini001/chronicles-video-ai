<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c140d"/>
      <stop offset="100%" stop-color="#0f0b07"/>
    </linearGradient>
  </defs>
  <rect width="320" height="420" fill="url(#bgGrad3)"/>

  <!-- Decision Fork Origin Node -->
  <circle cx="160" cy="320" r="22" fill="#241a10" stroke="#F5A524" stroke-width="2"/>
  <circle cx="160" cy="320" r="8" fill="#F5A524"/>

  <!-- Forking Paths -->
  <!-- Left Path (Choice A) -->
  <path d="M 160 298 C 160 230 90 200 90 140" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <!-- Choice A Node -->
  <circle cx="90" cy="120" r="32" fill="#14261a" stroke="#4ADE80" stroke-width="2"/>
  <path d="M 80 120 L 87 127 L 102 112" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Path (Choice B - Foregone / Cost) -->
  <path d="M 160 298 C 160 230 230 200 230 140" fill="none" stroke="#FB7185" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.8"/>
  <!-- Choice B Node -->
  <circle cx="230" cy="120" r="32" fill="#2a141a" stroke="#FB7185" stroke-width="2" opacity="0.9"/>
  <!-- Cross / trade-off symbol -->
  <line x1="220" y1="110" x2="240" y2="130" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="240" y1="110" x2="220" y2="130" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Balance scales / trade-off curve connecting them -->
  <path d="M 105 95 Q 160 65 215 95" fill="none" stroke="#F5A524" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Arrow heads on paths -->
  <polygon points="90,135 85,145 95,145" fill="#4ADE80"/>
  <polygon points="230,135 225,145 235,145" fill="#FB7185"/>

  <!-- Opportunity pulse ripples around origin -->
  <circle cx="160" cy="320" r="34" fill="none" stroke="#F5A524" stroke-width="1" opacity="0.4"/>
  <circle cx="160" cy="320" r="46" fill="none" stroke="#F5A524" stroke-width="1" stroke-dasharray="4 4" opacity="0.2"/>
</svg>