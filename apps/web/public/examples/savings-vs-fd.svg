<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c140d"/>
      <stop offset="100%" stop-color="#0f0b07"/>
    </linearGradient>
    <linearGradient id="colGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5A524"/>
      <stop offset="100%" stop-color="#E8901A"/>
    </linearGradient>
    <linearGradient id="colGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="420" fill="url(#bgGrad2)"/>

  <!-- Rupee Symbol badge at top -->
  <circle cx="160" cy="70" r="30" fill="#241a10" stroke="#F5A524" stroke-width="1.5"/>
  <text x="160" y="80" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFE2A8" text-anchor="middle">₹</text>

  <!-- Baseline -->
  <line x1="40" y1="330" x2="280" y2="330" stroke="#F5A524" stroke-width="2" opacity="0.3"/>

  <!-- Left Bar: Savings Account (Moderate Height) -->
  <rect x="70" y="210" width="65" height="120" rx="8" fill="#2a1d10" stroke="#F5A524" stroke-width="1.5"/>
  <rect x="75" y="230" width="55" height="95" rx="4" fill="#F5A524" opacity="0.25"/>
  <!-- Growth indicator / percentage line -->
  <text x="102" y="195" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F5A524" text-anchor="middle">3.5%</text>

  <!-- Right Bar: Fixed Deposit (Taller Height) -->
  <rect x="185" y="130" width="65" height="200" rx="8" fill="#14261a" stroke="#4ADE80" stroke-width="1.5"/>
  <rect x="190" y="150" width="55" height="175" rx="4" fill="url(#colGrad2)" opacity="0.4"/>
  <!-- Growth arrow on top -->
  <text x="217" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="middle">7.5%</text>

  <!-- Growth dashed curve -->
  <path d="M 102 180 Q 160 140 210 100" fill="none" stroke="#FFE2A8" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <polygon points="214,97 204,101 210,108" fill="#FFE2A8"/>

  <!-- Sub labels beneath baseline -->
  <rect x="65" y="345" width="75" height="24" rx="12" fill="#211810" stroke="#F5A524" stroke-width="1" opacity="0.8"/>
  <rect x="180" y="345" width="75" height="24" rx="12" fill="#152618" stroke="#4ADE80" stroke-width="1" opacity="0.8"/>
</svg>