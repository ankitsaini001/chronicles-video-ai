<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c140d"/>
      <stop offset="100%" stop-color="#0f0b07"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5A524" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="420" fill="url(#bgGrad1)"/>
  
  <!-- Subtle grid/atmosphere -->
  <circle cx="240" cy="90" r="70" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="240" cy="90" r="26" fill="#F5A524"/>
  <circle cx="240" cy="90" r="34" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

  <!-- Evaporation arrows rising -->
  <path d="M 120 280 Q 130 220 150 170" fill="none" stroke="#F5A524" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.85"/>
  <polygon points="150,165 145,175 155,175" fill="#F5A524"/>

  <path d="M 80 290 Q 90 230 110 180" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <polygon points="110,175 106,183 114,183" fill="#F5A524" opacity="0.8"/>

  <!-- Cloud 1 -->
  <g fill="#2e2216" stroke="#F5A524" stroke-width="1.5" opacity="0.95">
    <path d="M 80 150 a 24 24 0 0 1 34 -8 a 32 32 0 0 1 54 6 a 22 22 0 0 1 12 36 l -96 0 a 17 17 0 0 1 -4 -34 z"/>
  </g>
  <!-- Cloud 2 -->
  <g fill="#241a10" stroke="#F5A524" stroke-width="1.5" opacity="0.8">
    <path d="M 170 120 a 18 18 0 0 1 26 -6 a 24 24 0 0 1 40 4 a 16 16 0 0 1 8 26 l -70 0 a 13 13 0 0 1 -4 -24 z"/>
  </g>

  <!-- Rain arrows / droplets -->
  <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="95" y1="195" x2="85" y2="225"/>
    <line x1="120" y1="195" x2="110" y2="225"/>
    <line x1="145" y1="195" x2="135" y2="225"/>
    <line x1="105" y1="235" x2="95" y2="265"/>
    <line x1="130" y1="235" x2="120" y2="265"/>
  </g>

  <!-- Water Surface / Landscape -->
  <path d="M 0 330 Q 80 320 160 335 T 320 330 L 320 420 L 0 420 Z" fill="#141a24" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
  <!-- Mountain outline -->
  <path d="M 0 330 L 70 260 L 150 335" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0.4"/>
  <path d="M 120 330 L 180 275 L 240 330" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0.3"/>

  <!-- Flow curve connecting cycle -->
  <path d="M 230 190 C 270 240 280 320 220 350 C 160 375 80 370 40 345" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
</svg>